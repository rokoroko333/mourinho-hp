# Every day after the free limits reset (00:00 UTC): fails when yesterday's use of any Cloudflare free-plan daily limit
# reached 70% (scripts/usage.mjs), so GitHub emails the owner before a limit stops the site's live parts.
# Needs the repository secret CLOUDFLARE_API_TOKEN: an API token with only "Account Analytics: Read" (README,
# "Free-plan usage"). Read-only: one GraphQL query.
name: Usage

on:
  schedule:
    - cron: '40 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usage
  cancel-in-progress: false

jobs:
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: node scripts/usage.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
