# Runs the tests and the build on every PR and on main, so a change that breaks either cannot be merged
# unnoticed (the Stop hook only runs inside Claude Code sessions).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Bundles the Worker and the Pages Functions with the locked wrangler, without deploying (no login needed),
      # so a wrangler update or an import that only breaks the bundle fails here, not at release time.
      - run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker" --config workers/feeds/wrangler.toml
      - run: npx wrangler pages functions build --outdir "$RUNNER_TEMP/functions"
